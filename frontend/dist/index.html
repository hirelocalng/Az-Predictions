    <!-- OneSignal Web Push SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "15961974-7c73-430f-a7f4-23a69f27f7b8",
          serviceWorkerPath: "sw.js",
          serviceWorkerParam: { scope: "/" },
          allowLocalhostAsSecureOrigin: true,
        });
        // serviceWorkerPath/Param keep OneSignal on the combined /sw.js
        // worker instead of the default OneSignalSDKWorker.js, avoiding a
        // scope conflict with main.jsx's own navigator.serviceWorker.register('/sw.js').
        // Cache subscription ID immediately and on every change so it's
        // available even before the user logs in (anonymous subscribers).
        function cacheSubId() {
          var id = OneSignal.User && OneSignal.User.PushSubscription && OneSignal.User.PushSubscription.id;
          if (id) localStorage.setItem('os_sub_id', id);
          return id || null;
        }
        // Also persist to the backend so anonymous subscribers can receive
        // broadcasts even if they never create an account.
        function saveAnonymousToken() {
          var id = cacheSubId();
          if (!id) return;
          fetch('/api/push/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ player_id: id }),
          }).catch(function() {});
        }
        saveAnonymousToken();
        try {
          OneSignal.User.PushSubscription.addEventListener('change', saveAnonymousToken);
        } catch(e) {}
        // Prompt all visitors for push permission (slidedown UI)
        try { await OneSignal.Slidedown.promptPush(); } catch(e) {}
      });
    </script>

    <!-- Capture PWA install prompt BEFORE React mounts (fires very early) -->
    <script>
      window.__pwaPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaPrompt = e;
        window.dispatchEvent(new Event('pwainstallready'));
      });
    </script>
